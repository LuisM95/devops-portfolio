# CI-CD Pipeline


name: Build and Push Docker Images 

on: 
  push:
    branches: [develop] 

jobs: 
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies 
        run: pip install pytest

      - name: Run test
        run: python3 -m pytest tests/ -v

  build-system-info:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push System-Info
        run: |
          docker build -t luismarteel/system_info:latest \
          ./docker/system_info/
          docker push luismarteel/system_info:latest

  build-webapp:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push webapp
        run: |
          docker build -t luismarteel/devops-webapp:latest \
          ./kubernetes/webapp/ 
          docker push luismarteel/devops-webapp:latest
